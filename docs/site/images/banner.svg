<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="StudyMate — RAG-ассистент по учебным материалам">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111b35"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="170" fill="#4f8cff" opacity="0.16"/>
  <circle cx="1180" cy="310" r="150" fill="#7c5cff" opacity="0.18"/>
  <circle cx="140" cy="330" r="120" fill="#19b5a5" opacity="0.10"/>
  <g filter="url(#glow)">
    <text x="72" y="118" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">StudyMate</text>
    <rect x="72" y="140" width="330" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
  <text x="72" y="198" fill="#c8d4ea" font-family="Segoe UI, Arial, sans-serif" font-size="26">RAG-ассистент по учебным материалам курса</text>
  <text x="72" y="238" fill="#8fa3c4" font-family="Segoe UI, Arial, sans-serif" font-size="18">Ответы на вопросы студентов с цитатами, страницами и оценкой качества RAGAS</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="72" y="280" width="196" height="38" rx="19" fill="#16233f" stroke="#2c4570"/>
    <text x="170" y="305" fill="#9fc0ff" text-anchor="middle">41 документ · 15 784 стр.</text>
    <rect x="282" y="280" width="196" height="38" rx="19" fill="#16233f" stroke="#2c4570"/>
    <text x="380" y="305" fill="#9fc0ff" text-anchor="middle">Hybrid RAG · BM25 + Chroma</text>
    <rect x="492" y="280" width="206" height="38" rx="19" fill="#16233f" stroke="#2c4570"/>
    <text x="595" y="305" fill="#9fc0ff" text-anchor="middle">Llama-3.1-70B · USER2-base</text>
  </g>
  <g transform="translate(940 120)">
    <rect x="0" y="0" width="250" height="160" rx="22" fill="#0f1729" stroke="#2c4570"/>
    <rect x="20" y="24" width="210" height="14" rx="7" fill="#22345a"/>
    <rect x="20" y="50" width="150" height="10" rx="5" fill="#314a78"/>
    <rect x="20" y="70" width="180" height="10" rx="5" fill="#314a78"/>
    <rect x="20" y="96" width="210" height="44" rx="12" fill="#4f8cff" opacity="0.16"/>
    <text x="32" y="124" fill="#8fb4ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">источники · страницы · токены</text>
  </g>
</svg>
